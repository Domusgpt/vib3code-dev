<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - VIB3CODE Digital Magazine</title>
    <meta name="description" content="Visual essays and video content exploring digital sovereignty and EMA principles">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+Pro:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/article-style.css">

    <style>
        /* Video Section Specific Styles */
        .video-hero {
            padding: 8rem 2rem 4rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 204, 0, 0.2) 0%, rgba(26, 26, 46, 0) 100%);
        }

        .video-hero h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffcc00 0%, #e94560 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .video-hero p {
            font-size: 1.25rem;
            color: var(--color-text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Controls */
        .controls-section {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-sans);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        .sort-select {
            padding: 1rem 2.5rem 1rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-sans);
            cursor: pointer;
        }

        /* Category Filters */
        .category-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .category-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            color: var(--color-text);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-btn:hover {
            background: rgba(255, 204, 0, 0.2);
            border-color: #ffcc00;
        }

        .category-btn.active {
            background: #ffcc00;
            border-color: #ffcc00;
            color: #000;
        }

        /* Videos Grid */
        .videos-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .video-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: #ffcc00;
            box-shadow: 0 20px 40px rgba(255, 204, 0, 0.2);
        }

        .video-thumbnail {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.3), rgba(233, 69, 96, 0.2));
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
        }

        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.5);
        }

        .video-duration {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .video-content {
            padding: 1.5rem;
        }

        .video-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .category-badge {
            padding: 0.25rem 0.75rem;
            background: rgba(255, 204, 0, 0.2);
            border: 1px solid #ffcc00;
            border-radius: 100px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .video-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            color: var(--color-wisdom);
        }

        .video-excerpt {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }

        .video-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffcc00, var(--color-bridge));
        }

        .author-name {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .engagement-stats {
            display: flex;
            gap: 1rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-muted);
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--color-text);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-family: var(--font-sans);
            color: var(--color-text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .video-hero h1 {
                font-size: 2.5rem;
            }

            .videos-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- VIB34D Configuration -->
    <script>
        window.VIB34DConfig = {
            visualizerCount: 1,
            visualizerRoles: ['unified'],
            defaultGeometry: 'sphere',
            defaultPreset: 'editorial',
            enableCanvasConsolidation: true,
            visualizerOpacity: 0.12,
            visualizerSpeed: 0.4,
            backgroundMode: true,
            enableCrystalUI: false,
            targetFPS: 60,
            enableViewportOptimization: true,
            debugMode: false
        };
    </script>

    <!-- Header Navigation -->
    <header class="header">
        <nav class="nav-container">
            <a href="../index.html" class="logo">VIB3CODE</a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="articles.html" class="nav-link">Articles</a>
                <a href="video.html" class="nav-link active">Video</a>
                <a href="audio.html" class="nav-link">Audio</a>
                <a href="community.html" class="nav-link">Community</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="video-hero" data-section="videos">
        <h1>Video</h1>
        <p>Visual essays and conversations exploring the future of digital sovereignty</p>
    </section>

    <!-- Controls Section -->
    <section class="controls-section">
        <!-- Search Bar -->
        <div class="search-bar">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search videos..."
                    aria-label="Search videos"
                >
            </div>
            <select class="sort-select" id="sortSelect" aria-label="Sort videos">
                <option value="newest">Newest First</option>
                <option value="popular">Most Popular</option>
                <option value="duration">Duration</option>
            </select>
        </div>

        <!-- Category Filters -->
        <div class="category-filters">
            <button class="category-btn active" data-category="all">All Videos</button>
            <button class="category-btn" data-category="video-essay">Video Essays</button>
            <button class="category-btn" data-category="interview">Interviews</button>
            <button class="category-btn" data-category="tutorial">Tutorials</button>
            <button class="category-btn" data-category="documentary">Documentaries</button>
        </div>
    </section>

    <!-- Videos Grid -->
    <section class="videos-grid" id="videosGrid">
        <div class="loading">
            <p>Loading videos...</p>
        </div>
    </section>

    <!-- VIB34D System Scripts -->
    <script src="../js/vib34d-core.js"></script>
    <script src="../js/vib34d-multi-instance.js"></script>
    <script src="../js/vib34d-home-master.js"></script>
    <script src="../js/vib34d-transition-engine.js"></script>
    <script src="../js/vib34d-style-system.js"></script>

    <!-- Video System Script -->
    <script>
        const VideosApp = {
            videos: [],
            users: {},
            filteredVideos: [],
            currentCategory: 'all',
            currentSort: 'newest',
            searchQuery: '',

            async init() {
                await this.loadData();
                this.setupEventListeners();
                this.renderVideos();
            },

            async loadData() {
                try {
                    const contentResponse = await fetch('../data/content.json');
                    const contentData = await contentResponse.json();
                    this.videos = contentData.videos || [];

                    const usersResponse = await fetch('../data/users.json');
                    const usersData = await usersResponse.json();
                    this.users = {};
                    usersData.users.forEach(user => {
                        this.users[user.id] = user;
                    });

                    this.filteredVideos = [...this.videos];
                } catch (error) {
                    console.error('Error loading data:', error);
                    document.getElementById('videosGrid').innerHTML = `
                        <div class="empty-state">
                            <h3>Error Loading Videos</h3>
                            <p>Unable to load content. Please try again later.</p>
                        </div>
                    `;
                }
            },

            setupEventListeners() {
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentCategory = e.target.dataset.category;
                        this.filterAndSort();
                    });
                });

                document.getElementById('sortSelect').addEventListener('change', (e) => {
                    this.currentSort = e.target.value;
                    this.filterAndSort();
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value.toLowerCase();
                    this.filterAndSort();
                });
            },

            filterAndSort() {
                let filtered = this.videos;

                if (this.currentCategory !== 'all') {
                    filtered = filtered.filter(video => video.category === this.currentCategory);
                }

                if (this.searchQuery) {
                    filtered = filtered.filter(video =>
                        video.title.toLowerCase().includes(this.searchQuery) ||
                        video.excerpt.toLowerCase().includes(this.searchQuery)
                    );
                }

                filtered = [...filtered];
                switch (this.currentSort) {
                    case 'newest':
                        filtered.sort((a, b) => new Date(b.metadata.published_at) - new Date(a.metadata.published_at));
                        break;
                    case 'popular':
                        filtered.sort((a, b) => (b.engagement?.view_count || 0) - (a.engagement?.view_count || 0));
                        break;
                    case 'duration':
                        filtered.sort((a, b) => (a.media.duration || 0) - (b.media.duration || 0));
                        break;
                }

                this.filteredVideos = filtered;
                this.renderVideos();
            },

            renderVideos() {
                const grid = document.getElementById('videosGrid');

                if (this.filteredVideos.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <h3>No Videos Found</h3>
                            <p>Try adjusting your filters or search query.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = this.filteredVideos.map(video => {
                    const author = this.users[video.author_id];
                    const categoryLabel = this.getCategoryLabel(video.category);
                    const duration = this.formatDuration(video.media.duration);

                    return `
                        <a href="${video.url}" class="video-card">
                            <div class="video-thumbnail">
                                ${video.media.thumbnail}
                                <div class="play-overlay">▶</div>
                                <div class="video-duration">${duration}</div>
                            </div>
                            <div class="video-content">
                                <div class="video-meta">
                                    <span class="category-badge">${categoryLabel}</span>
                                </div>
                                <h2 class="video-title">${video.title}</h2>
                                <p class="video-excerpt">${video.excerpt}</p>
                                <div class="video-footer">
                                    <div class="author-info">
                                        <img src="${author?.profile.avatar_url || ''}" alt="${author?.profile.display_name || 'Author'}" class="author-avatar" onerror="this.style.display='none'">
                                        <span class="author-name">${author?.profile.display_name || 'VIB3CODE'}</span>
                                    </div>
                                    <div class="engagement-stats">
                                        <span class="stat-item">👁️ ${this.formatNumber(video.engagement?.view_count || 0)}</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            },

            getCategoryLabel(category) {
                const labels = {
                    'video-essay': 'Video Essay',
                    'interview': 'Interview',
                    'tutorial': 'Tutorial',
                    'documentary': 'Documentary'
                };
                return labels[category] || category;
            },

            formatDuration(seconds) {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            },

            formatNumber(num) {
                if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'k';
                }
                return num.toString();
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => VideosApp.init());
        } else {
            VideosApp.init();
        }
    </script>
</body>
</html>
